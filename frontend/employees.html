<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employees - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>

<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Employees</h5>
                    <div class="d-flex gap-2">
                        <button id="runPayrollBtn" class="btn btn-outline-secondary d-none">
                            <i class="bi bi-cash-stack me-1"></i>Run Monthly Payroll
                        </button>
                        <button id="addEmployeeBtn" class="btn btn-accent d-none">
                            <i class="bi bi-plus-lg me-1"></i>Add Employee
                        </button>
                    </div>
                </div>
                <table class="table table-institute">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Designation</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Login</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="employeeModalTitle">Add Employee</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="employeeForm">
                    <div class="modal-body">
                        <input type="hidden" id="employeeId">
                        <div class="mb-2">
                            <label class="form-label">Full Name *</label>
                            <input type="text" id="full_name" class="form-control name-input"
                                pattern="[A-Za-z\s]{2,100}" title="Only letters and spaces" required>
                        </div>
                        <div class="row">
                            <div class="col mb-2">
                                <label class="form-label">Designation</label>
                                <input type="text" id="designation" class="form-control" required>
                            </div>
                            <div class="col mb-2">
                                <label class="form-label">Department</label>
                                <input type="text" id="department" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col mb-2">
                                <label class="form-label">Phone *</label>
                                <input type="tel" id="phone" class="form-control phone-input" placeholder="03XXXXXXXXX"
                                    pattern="[0-9]{11}" maxlength="11" inputmode="numeric"
                                    title="Enter exactly 11 digits" required>
                            </div>
                            <div class="col mb-2">
                                <label class="form-label">CNIC *</label>
                                <input type="text" id="cnic" class="form-control cnic-input"
                                    placeholder="XXXXX-XXXXXXX-X" pattern="\d{5}-\d{7}-\d{1}" maxlength="15"
                                    title="Format: 12345-1234567-1" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col mb-2">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Address</label>
                            <input type="text" id="address" class="form-control">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Joining Date</label>
                            <input type="date" id="joining_date" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Salary</label>
                            <input type="number" step="0.01" min="0" id="salary" class="form-control" placeholder="0">
                        </div>
                        <div class="mb-2">
    <label class="form-label">Assigned Course (for Attendance access)</label>
    <select id="assigned_course" class="form-select">
        <option value="">None</option>
    </select>
</div>
                        <div id="formError" class="alert alert-danger d-none mt-2 mb-0 py-2"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-accent">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Grant Login Modal -->
    <div class="modal fade" id="grantLoginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Grant Login Access</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="grantLoginForm">
                    <div class="modal-body">
                        <input type="hidden" id="grantEmployeeId">
                        <div class="mb-2">
                            <label class="form-label">Username</label>
                            <input type="text" id="loginUsername" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>
                        <div id="grantError" class="alert alert-danger d-none mt-2 mb-0 py-2"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-accent">Grant Access</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/employees.js"></script>
</body>

</html>
