<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expenses - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Expenses</h5>
                    <button class="btn btn-accent" onclick="openAddModal()">
                        <i class="bi bi-plus-lg me-1"></i>New Expense
                    </button>
                </div>
                <table class="table table-institute">
                    <thead>
                        <tr><th>Title</th><th>Amount</th><th>Date</th><th>Category</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody id="expensesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="expenseModalTitle">Software House Expense Entry Form</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="expenseForm">
                    <div class="modal-body">
                        <input type="hidden" id="expenseId">
                        <div class="mb-2">
                            <label class="form-label">Expense Title *</label>
                            <input type="text" id="e_title" class="form-control" placeholder="AWS Server Bill, Office Tea & Snacks" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Amount *</label>
                            <input type="number" step="0.01" min="1" id="e_amount" class="form-control" placeholder="0" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Date *</label>
                            <input type="date" id="e_date" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Category *</label>
                            <input type="text" id="e_category" class="form-control" placeholder="e.g., Utilities, Infrastructure, HR" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Description / Notes *</label>
                            <textarea id="e_description" class="form-control" rows="2" required></textarea>
                        </div>
                        <div id="expenseError" class="alert alert-danger d-none py-2 mb-0"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-accent">Submit Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/expenses.js"></script>
</body>
</html>
