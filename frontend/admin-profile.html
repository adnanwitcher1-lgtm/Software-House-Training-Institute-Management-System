<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card" style="max-width: 500px;">
                <h5 class="mb-3">My Profile</h5>

                <div class="avatar-upload-circle" id="avatarCircle" onclick="document.getElementById('avatarInput').click()">
                    <i class="bi bi-camera-fill" id="avatarPlaceholderIcon"></i>
                    <img id="avatarPreview" style="display:none;">
                </div>
                <div class="avatar-upload-label">Click to change picture</div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                <div id="avatarMsg" class="alert d-none mt-2 py-2 text-center small"></div>

                <hr class="my-3">

                <form id="profileForm">
                    <div class="mb-2">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" disabled>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Role</label>
                        <input type="text" id="role" class="form-control" disabled>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Phone <span class="text-muted small">(editable)</span></label>
                        <input type="text" id="phone" class="form-control">
                    </div>
                    <div id="profileMsg" class="alert d-none mt-2 py-2"></div>
                    <button type="submit" class="btn btn-accent mt-2">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/admin-profile.js"></script>
</body>
</html>
