<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Attendance - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/custom.css?v=2" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">

            <!-- Mark Attendance -->
            <div id="markSection">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h4 class="mb-0">Employee Attendance</h4>
                    <div class="d-flex align-items-center gap-2">
                        <label for="attDate" class="mb-0 small">Date</label>
                        <input type="date" id="attDate" class="form-control form-control-sm" style="width:auto;">
                        <button class="btn btn-sm btn-outline-secondary" id="viewPreviousBtn">View Previous</button>
                    </div>
                </div>

                <div class="surface-card">
                    <div id="attMsg" class="alert d-none py-2"></div>
                    <p class="small mb-3" style="color:var(--color-muted);">Employees not yet marked for this date default to Present.</p>
                    <table class="table table-institute">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Employee</th>
                                <th>Designation</th>
                                <th>Department</th>
                                <th class="text-end">Status</th>
                            </tr>
                        </thead>
                        <tbody id="attBody"></tbody>
                    </table>
                    <div class="text-end mt-3">
                        <button id="submitAttBtn" class="btn btn-accent">Submit Attendance</button>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div id="historySection" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Attendance History</h4>
                    <button class="btn btn-sm btn-outline-secondary" id="backToMarkBtn">← Back</button>
                </div>

                <div class="surface-card">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" id="filterDate" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Employee</label>
                            <select id="filterEmployee" class="form-select">
                                <option value="">All</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button class="btn btn-outline-secondary w-100" id="filterBtn">Filter</button>
                        </div>
                    </div>
                    <p class="small mb-2" style="color:var(--color-muted);">If no date or employee is selected, the last 30 days are shown.</p>
                    <div id="histMsg" class="alert d-none py-2"></div>
                    <table class="table table-institute">
                        <thead>
                            <tr><th>Employee</th><th>Designation</th><th>Status</th><th class="text-end">Quick Action</th></tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/employee-attendance.js"></script>
</body>
</html>
