<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Leads - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Daily Leads</h5>
                    <button class="btn btn-accent" onclick="openAddModal()">
                        <i class="bi bi-plus-lg me-1"></i>New Lead
                    </button>
                </div>
                <table class="table table-institute">
                    <thead>
                        <tr><th>Student Name</th><th>Father's Name</th><th>Phone</th><th>Course</th><th>Reference</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody id="leadsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="leadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="leadModalTitle">New Lead</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="leadForm">
                    <div class="modal-body">
                        <input type="hidden" id="leadId">
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Student Name *</label>
                                <input type="text" id="l_full_name" class="form-control name-input"
                                    placeholder="Enter full name" pattern="[A-Za-z\s]{2,60}"
                                    title="Only letters and spaces, 2-60 characters" required>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Father's Name *</label>
                                <input type="text" id="l_guardian_name" class="form-control name-input"
                                    placeholder="Enter father's name" pattern="[A-Za-z\s]{2,60}"
                                    title="Only letters and spaces, 2-60 characters" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Student Phone Number *</label>
                                <input type="tel" id="l_phone" class="form-control phone-input"
                                    placeholder="03XXXXXXXXX" pattern="[0-9]{11}" maxlength="11" inputmode="numeric"
                                    title="Enter exactly 11 digits" required>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Father / Guardian Phone Number *</label>
                                <input type="tel" id="l_guardian_phone" class="form-control phone-input"
                                    placeholder="03XXXXXXXXX" pattern="[0-9]{11}" maxlength="11" inputmode="numeric"
                                    title="Enter exactly 11 digits" required>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Gender *</label>
                            <select id="l_gender" class="form-select" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Residential Address *</label>
                            <textarea id="l_address" class="form-control" rows="2"
                                placeholder="Enter full home address" required></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Course Selection *</label>
                            <select id="l_course" class="form-select" required></select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Reference</label>
                            <input type="text" id="l_reference" class="form-control"
                                placeholder="Who referred this person? (optional)" maxlength="150">
                        </div>
                        <div id="leadError" class="alert alert-danger d-none py-2 mb-0"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-accent">Submit Lead</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/daily-leads.js"></script>
</body>
</html>
