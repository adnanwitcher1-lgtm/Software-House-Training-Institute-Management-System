<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Leads - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Daily Leads</h5>
                    <button class="btn btn-accent" onclick="openAddModal()">
                        <i class="bi bi-plus-lg me-1"></i>New Lead
                    </button>
                </div>
                <table class="table table-institute">
                    <thead>
                        <tr><th>Name</th><th>Company</th><th>Phone</th><th>Interested In</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody id="leadsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="leadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="leadModalTitle">Request a Consultation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="leadForm">
                    <div class="modal-body">
                        <input type="hidden" id="leadId">
                        <div class="mb-2">
                            <label class="form-label">Full Name *</label>
                            <input type="text" id="l_full_name" class="form-control name-input" pattern="[A-Za-z\s]{2,100}" placeholder="Jane Smith" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Work Email *</label>
                            <input type="email" id="l_work_email" class="form-control" placeholder="jane@company.com" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Company Name *</label>
                            <input type="text" id="l_company_name" class="form-control" placeholder="Innovatech Solutions" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Job Title *</label>
                            <input type="text" id="l_job_title" class="form-control" placeholder="Marketing Director" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" id="l_phone" class="form-control phone-input" placeholder="03XXXXXXXXX" pattern="[0-9]{11}" maxlength="11" inputmode="numeric" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Estimated Budget *</label>
                            <input type="text" id="l_estimated_budget" class="form-control" placeholder="Describe your budget range" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Interested In *</label>
                            <input type="text" id="l_interested_in" class="form-control" placeholder="e.g., Enterprise Suite, Consulting" required>
                        </div>
                        <div id="leadError" class="alert alert-danger d-none py-2 mb-0"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-accent">Request Consultation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/daily-leads.js"></script>
</body>
</html>
