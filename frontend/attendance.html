<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">

            <!-- Mark Attendance -->
            <div class="surface-card mb-4" id="markAttendanceSection">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Mark Attendance</h5>
                    <button class="btn btn-sm btn-outline-secondary" id="viewPreviousBtn">View Previous</button>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Course</label>
                        <select id="markCourse" class="form-select"></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input type="date" id="markDate" class="form-control">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button class="btn btn-outline-secondary w-100" onclick="loadEnrolledStudents()">Load Students</button>
                    </div>
                </div>
                                <div class="mb-2" id="markSearchWrap" style="display:none;">
                    <input type="text" id="markRegSearch" class="form-control" placeholder="Search by Registration No.">
                </div>
                <table class="table table-institute" id="markTable" style="display:none;">
                    <thead>
                        <tr><th>Reg No</th><th>Student</th><th style="width:220px;">Attendance</th></tr>
                    </thead>
                    <tbody id="markTableBody"></tbody>
                </table>

                <div id="markMsg" class="alert d-none mt-2 py-2"></div>
                <button id="submitAttendanceBtn" class="btn btn-accent mt-2" style="display:none;" onclick="submitAttendance()">
                    Submit Attendance
                </button>
            </div>

            <!-- History -->
            <!-- History -->
            <div class="surface-card" id="historySection" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Attendance History</h5>
                    <button class="btn btn-sm btn-outline-secondary" id="backToMarkBtn">← Back</button>
                </div>
                <div class="row g-2 mb-3">
                  <div class="col-md-3">
                      <label class="form-label">Course</label>
                      <select id="filterCourse" class="form-select">
                          <option value="">All</option>
                      </select>
                  </div>
                  <div class="col-md-3">
                      <label class="form-label">Date</label>
                      <input type="date" id="filterDate" class="form-control">
                  </div>
                  <div class="col-md-3">
                      <label class="form-label">Registration No.</label>
                      <input type="text" id="filterRegNumber" class="form-control" placeholder="e.g. STD-2026-0001">
                  </div>
                  <div class="col-md-3 d-flex align-items-end">
                      <button class="btn btn-outline-secondary w-100" onclick="loadHistory()">Filter</button>
                  </div>
              </div>

                <table class="table table-institute" style="border-collapse: collapse;">
                    <thead>
                        <tr><th>Reg No</th><th>Student</th><th>Course</th><th>Status</th><th class="text-end">Quick Action</th></tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
