<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Announcements - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>

<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Announcements</h5>
                    <button class="btn btn-accent" id="addAnnouncementBtn" style="display:none;"
                        onclick="openAddModal()">
                        <i class="bi bi-plus-lg me-1"></i>New Announcement
                    </button>
                </div>
                <div id="announcementsList"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="announcementModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="announcementModalTitle">New Announcement</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="announcementForm">
                    <div class="modal-body">
                        <input type="hidden" id="announcementId">
                        <div class="mb-2">
                            <label class="form-label">Title</label>
                            <input type="text" id="a_title" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Content</label>
                            <textarea id="a_content" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Status *</label>
                            <select id="a_status" class="form-select" required>
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                            </select>
                        </div>
                        <div id="announcementError" class="alert alert-danger d-none py-2 mb-0"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-accent">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/announcements.js"></script>
</body>

</html>
