<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fees & Payments - Institute Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>

<body>
    <div id="navbar-container"></div>
    <div class="d-flex">
        <div id="sidebar-container" style="width: 250px; min-height: calc(100vh - 65px);"></div>
        <div class="flex-grow-1 p-4">
            <div class="surface-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex gap-2">
                        <input type="text" id="searchInput" class="form-control"
                            placeholder="Search by student or course..." style="width: 280px;">
                        <select id="statusFilter" class="form-select" style="width: 160px;">
                            <option value="">All statuses</option>
                            <option value="unpaid">Unpaid</option>
                            <option value="partial">Partial</option>
                            <option value="paid">Paid</option>
                        </select>
                    </div>
                </div>

                <table class="table table-institute">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Total Fee</th>
                            <th>Paid</th>
                            <th>Remaining</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="feesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Fee Detail Modal -->
    <div class="modal fade" id="feeDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="feeDetailTitle">Fee Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-4"><strong>Total Fee:</strong> <span id="detailTotal"></span></div>
                        <div class="col-4"><strong>Paid:</strong> <span id="detailPaid"></span></div>
                        <div class="col-4"><strong>Remaining:</strong> <span id="detailRemaining"></span></div>
                    </div>

                    <h6>Payment History</h6>
                    <table class="table table-institute table-sm">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="paymentHistoryBody"></tbody>
                    </table>

                    <hr>
                    <h6>Record Payment</h6>
                    <form id="paymentForm" class="row g-2">
                        <input type="hidden" id="paymentFeeId">
                        <div class="col-md-4">
                            <label class="form-label">Amount *</label>
                            <input type="number" step="0.01" min="1" id="paymentAmount" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Method *</label>
                            <select id="paymentMethod" class="form-select" required>
                                <option value="cash">Cash</option>
                                <option value="bank">Bank</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Notes *</label>
                            <input type="text" id="paymentNotes" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <div id="paymentError" class="alert alert-danger d-none py-2 mb-2"></div>
                            <button type="submit" class="btn btn-accent">Record Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/fees.js"></script>
</body>

</html>
